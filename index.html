const ACT={
 trabalhar:["💼","Horas extras","Renda extra de trabalho.","+ cerca de 10% do salário",1],
 panfletar:["📣","Panfletagem","Converse com moradores e conquiste apoio.","- R$ 50 · + apoiadores",1],

const actPanel=()=>`<h3 style="margin:28px 0 12px">Ações do cidadão</h3><div class="grid">${Object.entries(ACT).map(([k,a])=>`<div class="stat"><b>${a[0]} ${a[1]}</b><span>${a[2]}</span><div class="muted" style="margin:6px 0 4px">${a[3]}</div><div class="muted" style="margin-bottom:10px">Recarga: ${a[4]} h</div><button data-act="${k}" style="width:100%">Executar</button></div>`).join("")}</div>`;
async function bindActions(){
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r=await SB.rpc("do_action",{p_world:world.id,p_action:b.dataset.act});
    if(r.error){b.disabled=false;return toast(r.error.message)}
    me=r.data.character;toast(r.data.msg,true);profile(me);
  });
  const {data}=await SB.from("action_log").select("action,created_at").eq("character_id",me.id).gte("created_at",new Date(Date.now()-6*36e5).toISOString());
  const seen={};
  (data||[]).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)).forEach(l=>{
    if(seen[l.action]||!ACT[l.action])return;seen[l.action]=1;
    const left=ACT[l.action][4]*36e5-(Date.now()-new Date(l.created_at));
    const b=document.querySelector(`[data-act="${l.action}"]`);
    if(b&&left>0){b.disabled=true;b.textContent=`Disponível em ${Math.max(1,Math.ceil(left/6e4))} min`}
  });
}

/* ---------- ETAPA 2: PARTIDOS, MOVIMENTOS, MANIFESTAÇÕES, ALIADOS ---------- */
const CAUSES={saude:"Saúde",educacao:"Educação",seguranca:"Segurança",meio_ambiente:"Meio ambiente",economia:"Economia e emprego",direitos:"Direitos e igualdade",moradia:"Moradia",agro:"Agro e campo",religiao:"Fé e valores",outro:"Outra causa"};
const GO={home:()=>profile(me),fin:()=>finance(),people:()=>people(),parties:()=>partiesView(),moves:()=>movesView(),allies:()=>alliesView(),manage:()=>manage()};
let W={t:0,parties:[],pm:[],mv:[],mm:[],rel:[],ch:{}};
async function loadW(force){
  if(!force&&W.world===world.id&&Date.now()-W.t<15000)return W;
  const q=t=>SB.from(t).select("*").eq("world_id",world.id);
  const [p,pm,mv,mm,rl,ch]=await Promise.all([q("parties"),q("party_members"),q("movements"),q("movement_members"),q("relations"),SB.from("characters").select("id,user_id,full_name,photo_url,city_name,state_uf,ideology,supporters").eq("world_id",world.id).limit(500)]);
  W={t:Date.now(),world:world.id,parties:p.data||[],pm:pm.data||[],mv:mv.data||[],mm:mm.data||[],rel:rl.data||[],ch:Object.fromEntries((ch.data||[]).map(c=>[c.id,c]))};
  return W;
}
const partyOf=cid=>{const m=W.pm.find(x=>x.character_id===cid);return m&&W.parties.find(p=>p.id===m.party_id)};
const movsOf=cid=>W.mm.filter(x=>x.character_id===cid).map(x=>W.mv.find(m=>m.id===x.movement_id)).filter(Boolean);
function affTags(cid){const p=partyOf(cid),ms=movsOf(cid);return (p?`<span class="tag">🏛️ ${esc(p.acronym)}</span>`:"")+ms.slice(0,2).map(m=>`<span class="tag b">✊ ${esc(m.name)}</span>`).join("")+(ms.length>2?`<span class="tag b">+${ms.length-2}</span>`:"")}
const partyTag=cid=>`<div style="margin-top:6px">${affTags(cid)||`<span class="muted">Sem partido nem movimento</span>`}</div>`;
async function openChar(id){if(id===me.id)return profile(me);view(loading("Abrindo perfil..."));const {data}=await SB.from("characters").select("*").eq("id",id).single();data?profile(data):(toast("Perfil não encontrado."),people())}
const prow=(cid,extra="")=>{const c=W.ch[cid];return c?`<div data-c="${cid}">${avatar(c)}<div style="flex:1"><b>${esc(c.full_name)}</b><div class="muted">${esc(c.city_name)}/${esc(c.state_uf)} · ${esc(IDEO[c.ideology])}</div></div>${extra}</div>`:""};
const bindRows=()=>document.querySelectorAll("[data-c]").forEach(r=>r.onclick=()=>openChar(r.dataset.c));
const empty=t=>`<p class="muted" style="padding:16px">${t}</p>`;
async function act(fn,args,msg){const r=await SB.rpc(fn,args);if(r.error){toast(r.error.message);return false}if(msg)toast(msg,true);await loadW(true);return true}

async function fillAffil(c){
  await loadW();const el=$("#aff");if(!el)return;
  let h=affTags(c.id)||`<span class="muted">Sem partido nem movimento.</span>`;
  if(c.user_id!==user.id){
    const r=W.rel.find(x=>(x.requester_id===me.id&&x.target_id===c.id)||(x.requester_id===c.id&&x.target_id===me.id));
    h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">`+(r?`<span class="tag">${r.status==="aceito"?(r.kind==="aliado"?"🤝 Aliado":"👋 Amigo"):"Pedido pendente"}</span>`:`<button class="sec" data-rq="amigo">👋 Adicionar amigo</button><button class="sec" data-rq="aliado">🤝 Pedir aliança</button>`)+`</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-rq]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await act("relate_request",{p_world:world.id,p_target:c.id,p_kind:b.dataset.rq},"Pedido enviado!"))fillAffil(c);else b.disabled=false});
}

/* ----- Partidos ----- */
async function partiesView(){
  view(loading("Carregando partidos..."));await loadW(true);
  const mine=partyOf(me.id),cnt=id=>W.pm.filter(x=>x.party_id===id).length;
  const list=[...W.parties].sort((a,b)=>a.is_real===b.is_real?a.acronym.localeCompare(b.acronym):a.is_real?1:-1);
  view(header("",null,"parties")+pageH("Partidos",`${W.parties.length} partidos neste mundo${mine?" · você é filiado ao "+esc(mine.acronym):""}`,`<button id="np">+ Fundar partido</button>`)+
   `<div class="grid wide">${list.map(p=>`<div class="card pcard ${mine?.id===p.id?"me":""}" data-p="${p.id}"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="brand" style="font-size:1.7rem">${esc(p.acronym)}</div><span class="muted">${p.number?"nº "+p.number:"sem número"}</span></div><b>${esc(p.name)}</b><div style="margin:10px 0"><span class="tag b">${esc(IDEO[p.ideology])}</span>${p.status==="em_formacao"?`<span class="tag y">Em formação ${cnt(p.id)}/5</span>`:""}${p.is_real?"":`<span class="tag">Criado por jogador</span>`}</div><div class="muted">👥 ${cnt(p.id)} filiado(s)</div></div>`).join("")}</div>`);
  bindHeader();
  document.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>partyDetail(el.dataset.p));
  $("#np").onclick=()=>modal("Fundar partido",`<p class="muted" style="margin-top:8px">Custa R$ 2.500,00 e exige 20 apoiadores. O partido só é registrado (e ganha número eleitoral) quando chegar a 5 filiados.</p><label>Nome do partido</label><input id="pn" maxlength="60"><label>Sigla (só letras)</label><input id="pa" maxlength="12"><label>Ideologia</label><select id="pi">${opts(IDEO,"centro")}</select><label>Descrição e propostas</label><textarea id="pd" maxlength="500"></textarea>`,async m=>{
    const r=await SB.rpc("create_party",{p_world:world.id,p_name:m.querySelector("#pn").value,p_acronym:m.querySelector("#pa").value,p_ideology:m.querySelector("#pi").value,p_desc:m.querySelector("#pd").value});
    if(r.error)throw r.error;toast("Partido fundado! Convide 4 filiados para o registro.",true);await loadW(true);partyDetail(r.data)},"Fundar");
}
function partyDetail(id){
  const p=W.parties.find(x=>x.id===id);if(!p)return partiesView();
  const ms=W.pm.filter(x=>x.party_id===id).sort((a,b)=>new Date(a.joined_at)-new Date(b.joined_at)),mine=partyOf(me.id);
  view(header("",partiesView,"parties")+`<div class="card"><div class="prof"><div class="av" style="border-radius:22px;font-size:1.05rem;text-align:center">${esc(p.acronym.slice(0,5))}</div><div style="flex:1;min-width:230px"><h2>${esc(p.name)}</h2><div style="margin:10px 0"><span class="tag">${esc(p.acronym)}</span>${p.number?`<span class="tag">nº ${p.number}</span>`:""}<span class="tag b">${esc(IDEO[p.ideology])}</span>${p.status==="em_formacao"?`<span class="tag y">Em formação: ${ms.length}/5 filiados para o registro</span>`:`<span class="tag">Registrado</span>`}</div><p>${esc(p.description||"Sem descrição.")}</p></div></div>
  <div style="margin-top:22px">${mine?.id===id?`<button class="dng" id="pl">Sair do partido</button>`:mine?`<span class="muted">Você é filiado ao ${esc(mine.acronym)}. Saia dele para se filiar a outro.</span>`:`<button id="pj">Filiar-se</button>`}</div></div>
  <h3 style="margin:30px 0 14px">Filiados (${ms.length})</h3><div class="card list">${ms.map(m=>prow(m.character_id,m.role==="presidente"?`<span class="tag">Presidente</span>`:"")).join("")||empty("Nenhum filiado ainda.")}</div>`);
  bindHeader();bindRows();
  if($("#pj"))$("#pj").onclick=async()=>{if(await act("join_party",{p_world:world.id,p_party:id},"Você se filiou!"))partyDetail(id)};
  if($("#pl"))$("#pl").onclick=async()=>{if(await act("leave_party",{p_world:world.id},"Você saiu do partido."))partiesView()};
}

/* ----- Movimentos e manifestações ----- */
async function movesView(){
  view(loading("Carregando movimentos..."));
  await SB.rpc("resolve_demos",{p_world:world.id});
  const [,{data:demos},{data:dp}]=await Promise.all([loadW(true),SB.from("demonstrations").select("*").eq("world_id",world.id).order("created_at",{ascending:false}).limit(30),SB.from("demo_participants").select("*").eq("world_id",world.id)]);
  const cnt=id=>W.mm.filter(x=>x.movement_id===id).length,mine=new Set(movsOf(me.id).map(m=>m.id)),now=Date.now();
  view(header("",null,"moves")+pageH("Movimentos e manifestações","Mobilize pessoas em torno de uma causa.",`<button id="nm">+ Criar movimento</button><button class="sec" id="nd">📢 Organizar manifestação</button>`)+
  `<h3 style="margin:4px 0 14px">Movimentos</h3><div class="grid wide">${W.mv.map(m=>`<div class="card pcard ${mine.has(m.id)?"me":""}" data-m="${m.id}"><b style="font-size:1.15rem">${esc(m.name)}</b><div style="margin:10px 0"><span class="tag b">${esc(CAUSES[m.cause]||m.cause)}</span>${mine.has(m.id)?`<span class="tag">Você participa</span>`:""}</div><div class="muted">👥 ${cnt(m.id)} membro(s) · líder: ${esc(W.ch[m.leader_id]?.full_name||"—")}</div></div>`).join("")||`<div class="card">${empty("Nenhum movimento ainda. Crie o primeiro!")}</div>`}</div>
  <h3 style="margin:36px 0 14px">Manifestações</h3><div class="card list">${(demos||[]).map(d=>{const open=d.status==="aberta"&&new Date(d.ends_at)>now,n=(dp||[]).filter(x=>x.demo_id===d.id).length,joined=(dp||[]).some(x=>x.demo_id===d.id&&x.character_id===me.id),mv=W.mv.find(m=>m.id===d.movement_id);
   return `<div style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:250px"><b>${open?"🟢":"⚪"} ${esc(d.title)}</b><div class="muted">${esc(CAUSES[d.cause]||d.cause)} · ${esc(d.city_name)}/${esc(d.state_uf)} · por ${esc(W.ch[d.organizer_id]?.full_name||"—")}${mv?" · "+esc(mv.name):""}</div>${!open&&d.result?`<div style="margin-top:8px">${esc(d.result)}</div>`:""}</div><div class="muted">${open?`Encerra em ${Math.max(1,Math.ceil((new Date(d.ends_at)-now)/6e4))} min`:`Público: ${d.turnout??0}`} · ${n} confirmado(s)</div>${open?(joined?`<span class="tag">Confirmado</span>`:`<button data-jd="${d.id}">Participar</button>`):""}</div>`}).join("")||empty("Nenhuma manifestação até agora.")}</div>`);
  bindHeader();
  document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>movDetail(el.dataset.m));
  document.querySelectorAll("[data-jd]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await act("join_demo",{p_world:world.id,p_demo:b.dataset.jd},"Presença confirmada!"))movesView();else b.disabled=false});
  $("#nm").onclick=()=>modal("Criar movimento",`<p class="muted" style="margin-top:8px">Custa R$ 200,00 e exige 5 apoiadores. Você pode liderar até 3 movimentos.</p><label>Nome</label><input id="mn" maxlength="60"><label>Causa</label><select id="mc">${opts(CAUSES)}</select><label>Descrição</label><textarea id="md" maxlength="500"></textarea>`,async m=>{
    const r=await SB.rpc("create_movement",{p_world:world.id,p_name:m.querySelector("#mn").value,p_cause:m.querySelector("#mc").value,p_desc:m.querySelector("#md").value});
    if(r.error)throw r.error;toast("Movimento criado!",true);await loadW(true);movDetail(r.data)},"Criar");
  $("#nd").onclick=()=>modal("Organizar manifestação",`<p class="muted" style="margin-top:8px">Custa R$ 200,00. Fica aberta por 6 horas para confirmações e o resultado depende do seu apoio e do público. Pode render apoio e reputação, ou esvaziar. Limite de uma a cada 6 horas.</p><label>Título</label><input id="dt" maxlength="80"><label>Causa</label><select id="dc">${opts(CAUSES)}</select><label>Movimento (opcional)</label><select id="dm"><option value="">Independente</option>${movsOf(me.id).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select><label>Descrição</label><textarea id="dd" maxlength="500"></textarea>`,async m=>{
    const r=await SB.rpc("create_demo",{p_world:world.id,p_title:m.querySelector("#dt").value,p_cause:m.querySelector("#dc").value,p_desc:m.querySelector("#dd").value,p_movement:m.querySelector("#dm").value||null});
    if(r.error)throw r.error;me=(await SB.rpc("settle_me",{p_world:world.id})).data;toast("Manifestação convocada!",true);movesView()},"Convocar");
}
function movDetail(id){
  const m=W.mv.find(x=>x.id===id);if(!m)return movesView();
  const ms=W.mm.filter(x=>x.movement_id===id).sort((a,b)=>new Date(a.joined_at)-new Date(b.joined_at)),isMem=ms.some(x=>x.character_id===me.id);
  view(header("",movesView,"moves")+`<div class="card"><h2>${esc(m.name)}</h2><div style="margin:10px 0"><span class="tag b">${esc(CAUSES[m.cause]||m.cause)}</span></div><p>${esc(m.description||"Sem descrição.")}</p><div style="margin-top:22px">${isMem?`<button class="dng" id="ml">Sair do movimento</button>`:`<button id="mj">Participar</button>`}</div></div>
  <h3 style="margin:30px 0 14px">Membros (${ms.length})</h3><div class="card list">${ms.map(x=>prow(x.character_id,x.role==="lider"?`<span class="tag">Líder</span>`:"")).join("")||empty("Sem membros.")}</div>`);
  bindHeader();bindRows();
  if($("#mj"))$("#mj").onclick=async()=>{if(await act("join_movement",{p_world:world.id,p_mov:id},"Você entrou no movimento!"))movDetail(id)};
  if($("#ml"))$("#ml").onclick=async()=>{if(await act("leave_movement",{p_world:world.id,p_mov:id},"Você saiu do movimento."))movesView()};
}

/* ----- Amigos e aliados ----- */
async function alliesView(){
  view(loading("Carregando sua rede..."));await loadW(true);
  const other=r=>r.requester_id===me.id?r.target_id:r.requester_id;
  const got=W.rel.filter(r=>r.status==="pendente"&&r.target_id===me.id),sent=W.rel.filter(r=>r.status==="pendente"&&r.requester_id===me.id),ok=W.rel.filter(r=>r.status==="aceito");
  const kind=r=>r.kind==="aliado"?`<span class="tag">🤝 Aliado</span>`:`<span class="tag b">👋 Amigo</span>`;
  const p=partyOf(me.id),ms=movsOf(me.id);
  const sec=(t,b)=>`<h3 style="margin:30px 0 14px">${t}</h3><div class="card list">${b}</div>`;
  view(header("",null,"allies")+pageH("Amigos e aliados","Sua rede política: gente do seu partido, dos seus movimentos e das suas alianças.")+
   (got.length?sec(`Pedidos recebidos (${got.length})`,got.map(r=>prow(r.requester_id,`${kind(r)}<button data-ra="${r.id}">Aceitar</button><button class="sec" data-rd="${r.id}">Recusar</button>`)).join("")):"")+
   sec(`Amigos e aliados (${ok.length})`,ok.map(r=>prow(other(r),`${kind(r)}<button class="sec" data-rm="${r.id}">Remover</button>`)).join("")||empty("Você ainda não tem amigos nem aliados. Abra o perfil de um cidadão para enviar um pedido."))+
   sec(p?`Meu partido: ${esc(p.acronym)}`:"Meu partido",p?W.pm.filter(x=>x.party_id===p.id&&x.character_id!==me.id).map(x=>prow(x.character_id,x.role==="presidente"?`<span class="tag">Presidente</span>`:"")).join("")||empty("Você é o único filiado por enquanto."):empty("Você ainda não é filiado a nenhum partido. Veja a aba Partidos."))+
   (ms.length?ms.map(m=>sec(`Movimento: ${esc(m.name)}`,W.mm.filter(x=>x.movement_id===m.id&&x.character_id!==me.id).map(x=>prow(x.character_id,x.role==="lider"?`<span class="tag">Líder</span>`:"")).join("")||empty("Você é o único membro por enquanto."))).join(""):sec("Meus movimentos",empty("Você ainda não participa de movimentos. Veja a aba Movimentos.")))+
   (sent.length?sec(`Pedidos enviados (${sent.length})`,sent.map(r=>prow(r.target_id,`${kind(r)}<span class="muted">aguardando</span>`)).join("")):""));
  bindHeader();bindRows();
  const bindB=(sel,fn,msg)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;if(await act(fn,b.dataset.args?JSON.parse(b.dataset.args):{},msg))alliesView();else b.disabled=false});
  document.querySelectorAll("[data-ra]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_respond",{p_rel:b.dataset.ra,p_accept:true},"Pedido aceito!"))alliesView()});
  document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_respond",{p_rel:b.dataset.rd,p_accept:false},"Pedido recusado."))alliesView()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_remove",{p_rel:b.dataset.rm},"Relação removida."))alliesView()});
}

/* ---------- SONS E INÍCIO ---------- */
let _w=false;addEventListener("pointerdown",()=>{if(!_w&&!user){_w=true;SND.welcome()}});
document.addEventListener("click",e=>{if(e.target.closest("button,.mode,.list>div,a"))SND.click()});
let _h=0;document.addEventListener("mouseover",e=>{const t=e.target.closest(".mode,button");if(t&&t!==window._ht&&Date.now()-_h>90){window._ht=t;_h=Date.now();SND.hover()}});
document.addEventListener("mouseout",()=>{window._ht=null});
SB.auth.onAuthStateChange((ev,s)=>{
  const u=s?.user||null;
  if(u&&(!user||user.id!==u.id)){user=u;SND.ok();hub();SB.from("states").select("*").order("name").then(r=>{if(r.data)states=r.data})}
  else if(!u){user=null;authView()}
});
SB.auth.getSession().then(({data})=>{if(!data.session)authView()});
</script>
