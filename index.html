const TABS=[["home","🏠","Início"],["fin","💰","Finanças"],["people","👥","Cidadãos"],["parties","🏛️","Partidos"],["myparty","⭐","Meu partido"],["moves","✊","Movimentos"],["allies","🤝","Aliados"],["elec","🗳️","Eleições"]];
const HTABS=[["h_play","🎮","Jogar"],["h_servers","🌐","Meus servidores"],["h_friends","👥","Amigos"],["h_settings","⚙️","Configurações"]];
function header(extra="",back=null,tab=null){
  _open=!!tab;
  if(tab&&world&&!tab.startsWith("h_")&&!_ivHere&&tab!=="parties"&&me){const ap=activeApp();if(ap&&ap.status!=="pendente_lider")extra=`<button class="ivb" id="ivb">${ivbText(ap)}</button>`+extra}
  if(tab&&world&&!tab.startsWith("h_")&&!extra.includes('id="clk"'))extra=`<span class="clock" id="clk">📅 ${esc(fmtGame())}</span>`+extra;
  const owner=world&&world.mode==="server"&&world.owner_id===user.id;
  return header0(extra,back)+(tab?`<div class="shell"><aside class="nav">${(tab.startsWith("h_")?HTABS:TABS.concat(owner?[["manage","⚙️","Gerenciar"]]:[])).map(([k,i,l])=>`<a data-tab="${k}" class="${k===tab?"on":""}"><span>${i}</span>${l}</a>`).join("")}</aside><main>`:"");
}
const pageH=(t,sub,right="")=>`<div class="page-h"><div><h2 class="brand">${t}</h2><p class="muted">${sub}</p></div><div class="acts">${right}</div></div>`;
const ivbText=ap=>{const left=ap.interview_at?Math.ceil((new Date(ap.interview_at)-Date.now())/1000):0,pn=esc(W.parties.find(x=>x.id===ap.party_id)?.acronym||"partido");return left>0?`⏳ Entrevista do ${pn} em ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")} · abrir`:`🎙️ Entrevista do ${pn} pronta · responder`};
function bindIvb(){clearInterval(window._ib);const b=$("#ivb");if(!b)return;b.onclick=()=>{const ap=activeApp();if(ap)interviewView(ap.id)};window._ib=setInterval(()=>{const e=$("#ivb"),ap=activeApp();if(!e||!ap){clearInterval(window._ib);return}e.innerHTML=ivbText(ap)},1000)}
function bindHeader(){bindSnd();bindIvb();document.querySelectorAll("[data-tab]").forEach(a=>a.onclick=()=>GO[a.dataset.tab]());if(_back&&$("#back"))$("#back").onclick=_back;$("#home").onclick=hub;$("#out").onclick=()=>SB.auth.signOut()}
function hub(){
  world=null;me=null;
  SB.from("profiles").select("*").eq("user_id",user.id).single().then(r=>{if(r.data)PR[user.id]=r.data});
  view(header("",null,"h_play")+pageH("Escolha seu caminho","Como você quer jogar?")+`
  <div class="grid">
   <div class="card mode" id="m1"><div class="ic">🎯</div><h3>Singleplayer</h3><p>Jogue sozinho com NPCs. Seu próprio Brasil, no seu ritmo.</p></div>
   <div class="card mode" id="m2"><div class="ic">🏛️</div><h3>Servers</h3><p>Crie ou entre em servidores abertos ou com senha, só com seus amigos.</p></div>
   <div class="card mode" id="m3"><div class="ic">🌎</div><h3>Multiplayer Global</h3><p>O Brasil aberto a todos. Crie movimentos e partidos de verdade.</p></div>
  </div>`);
  bindHeader();
  $("#m1").onclick=async()=>{view(loading("Carregando seu mundo..."));
    let {data}=await SB.from("worlds").select("*").eq("mode","single").eq("owner_id",user.id).limit(1);
    if(!data?.length){const r=await SB.rpc("create_world",{p_name:"Meu Brasil",p_description:"Singleplayer",p_mode:"single"});if(r.error)return toast(r.error.message);data=(await SB.from("worlds").select("*").eq("id",r.data)).data}
    enter(data[0]);
  };
  $("#m2").onclick=servers;
  $("#m3").onclick=async()=>{view(loading("Entrando no Brasil..."));const {data}=await SB.from("worlds").select("*").eq("mode","global").limit(1);data?.length?enter(data[0]):toast("Mundo global não encontrado.")};
}

async function servers(){
  view(loading("Buscando servidores..."));
  const [{data},{data:mine}]=await Promise.all([SB.from("worlds").select("*").eq("mode","server").order("created_at",{ascending:false}),SB.from("world_members").select("world_id").eq("user_id",user.id)]);
  const mySet=new Set((mine||[]).map(x=>x.world_id));
  view(header(`<button id="cs">+ Criar servidor</button>`,hub)+`<h2 class="brand">Servidores</h2><div class="card list" style="margin-top:14px">${
    (data||[]).map(w=>`<div data-id="${w.id}"><div style="flex:1"><b>${w.is_private?"🔒":"🌐"} ${esc(w.name)}</b><div class="muted">${esc(w.description||"Sem descrição")} · 1 ano = ${w.year_real_days} dias</div></div>${w.owner_id===user.id?`<button class="sec" data-mg="${w.id}" title="Gerenciar">⚙️</button>`:""}<button class="sec">Entrar</button></div>`).join("")||`<p class="muted" style="padding:12px">Nenhum servidor ainda. Crie o primeiro!</p>`}</div>`);
  bindHeader();
  $("#cs").onclick=()=>modal("Criar servidor",`<label>Nome</label><input id="sn" maxlength="60"><label>Descrição</label><textarea id="sd" maxlength="500"></textarea><label>Senha (deixe vazio para servidor aberto)</label><input id="sp" type="text"><label>Duração de 1 ano de jogo</label><select id="sy"><option value="7">7 dias reais</option><option value="14" selected>14 dias reais</option><option value="28">28 dias reais</option></select>`,async m=>{
    const r=await SB.rpc("create_world",{p_name:m.querySelector("#sn").value,p_description:m.querySelector("#sd").value,p_mode:"server",p_password:m.querySelector("#sp").value||null,p_year_real_days:+m.querySelector("#sy").value});
    if(r.error)throw r.error;const w=(await SB.from("worlds").select("*").eq("id",r.data)).data[0];setTimeout(()=>enter(w),50);
  },"Criar");
  document.querySelectorAll("[data-mg]").forEach(b=>b.onclick=e=>{e.stopPropagation();SND.click();world=data.find(x=>x.id===b.dataset.mg);me=null;manage()});
  document.querySelectorAll(".list [data-id]").forEach(el=>el.onclick=async()=>{
    const w=data.find(x=>x.id===el.dataset.id);
    if(mySet.has(w.id))return enter(w);
    const join=async pw=>{const r=await SB.rpc("join_world",{p_world:w.id,p_password:pw||null});if(r.error)throw r.error;enter(w)};
    w.is_private?modal("Servidor com senha",`<label>Senha</label><input id="jp" type="password">`,m=>join(m.querySelector("#jp").value),"Entrar"):join();
  });
}

/* ---------- PERSONAGEM ---------- */
async function enter(w){
  world=w;view(loading("Entrando no mundo..."));
  const [r]=await Promise.all([SB.rpc("settle_me",{p_world:w.id}),loadW(true)]);
  me=r.data?.id?r.data:null;
  me?profile(me):creator();
}
async function creator(){
  if(!states.length)states=(await SB.from("states").select("*").order("name")).data||[];
  view(header("",hub)+`<h2 class="brand">Crie seu personagem</h2><p class="muted">Mundo: ${esc(world.name)}</p>
  <div class="card" style="margin-top:14px"><div class="row"><div><label>Nome completo</label><input id="fn" maxlength="80"></div></div>
  <label>Descrição</label><textarea id="ds" maxlength="500" placeholder="Sua história, valores e bandeiras..."></textarea>
  <div class="row"><div><label>Ideologia</label><select id="id">${opts(IDEO,"centro")}</select></div><div><label>Perfil político</label><select id="pf">${opts(PROF,"ativista")}</select></div></div>
  <div class="row"><div><label>Estado inicial</label><select id="uf"><option value="">Selecione...</option>${states.map(s=>`<option value="${s.uf}">${esc(s.name)}</option>`).join("")}</select></div><div><label>Cidade inicial</label><select id="ct" disabled><option>Escolha o estado primeiro</option></select></div></div>
  <button class="full" id="sv">Começar minha jornada</button></div>`);
  bindHeader();
  $("#uf").onchange=async e=>{
    const ct=$("#ct");ct.disabled=true;ct.innerHTML="<option>Carregando...</option>";
    try{const uf=e.target.value;const j=CITY[uf]||(CITY[uf]=await (await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`)).json());
      ct.innerHTML=j.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");ct.disabled=false}catch{ct.innerHTML="<option>Erro ao carregar</option>"}
  };
  $("#sv").onclick=async()=>{
    const fn=$("#fn").value.trim(),uf=$("#uf").value,ct=$("#ct");
    if(fn.length<3||!uf||ct.disabled)return toast("Preencha nome, estado e cidade.");
    $("#sv").disabled=true;const photo_url=null;
    const ideo=$("#id").value;
    const r=await SB.from("characters").insert({user_id:user.id,world_id:world.id,full_name:fn,description:$("#ds").value.trim()||null,photo_url,ideology:ideo,econ_axis:AXIS[ideo],social_axis:AXIS[ideo],political_profile:$("#pf").value,state_uf:uf,city_ibge_id:+ct.value,city_name:ct.options[ct.selectedIndex].text}).select().single();
    if(r.error){$("#sv").disabled=false;return toast(r.error.message)}
    SND.ok();me=r.data;profile(me);
  };
}

function profile(c){
  const mine=c.user_id===user.id,owner=world.mode==="server"&&world.owner_id===user.id;
  const date=fmtGame();
  view(header(`<span class="clock" id="clk">📅 ${esc(date)}</span>`,mine?null:()=>people(),mine?"home":"people")+`<div class="card"><div class="prof">${avatar(c)}<div style="flex:1;min-width:200px">
   <h2>${esc(c.full_name)}</h2>${uname(c)}<div style="margin:6px 0"><span class="tag">${esc(CARGO[c.role]||c.role)}</span><span class="tag b">${esc(IDEO[c.ideology])}</span><span class="tag b">${esc(PROF[c.political_profile])}</span></div>
   <div class="muted">📍 ${esc(c.city_name)} — ${esc(c.state_uf)}</div><div id="aff" style="margin-top:12px"></div></div></div>
   <p style="margin-top:16px">${esc(c.description||"Sem descrição.")}</p>
   <div class="stats"><div class="stat"><b>${brl(c.salary)}</b><span>Salário mensal</span></div><div class="stat"><b>${brl(c.money)}</b><span>Dinheiro</span></div><div class="stat"><b>${c.supporters.toLocaleString("pt-BR")}</b><span>Apoiadores</span></div><div class="stat"><b>${c.reputation}/100</b><span>Reputação</span></div><div class="stat"><b>${brl(c.expenses)}</b><span>Gastos mensais</span></div><div class="stat"><b>${brl(c.salary-c.expenses)}</b><span>Saldo por mês de jogo</span></div></div>
   <div class="row" style="margin-top:20px">${mine?"":`<button class="dng" id="rp">Denunciar perfil</button>`}${owner?`<button class="sec" id="mg">⚙️ Gerenciar servidor</button>`:""}${mine?"":`<button id="bk">Meu perfil</button>`}</div>${mine?actPanel():""}</div>
   <p class="muted" style="margin-top:14px;text-align:center">Mundo: ${esc(world.name)} · Em breve: partidos, movimentos, manifestações e eleições.</p>`);
  bindHeader();
  if($("#mg"))$("#mg").onclick=manage;if(mine)bindActions();fillAffil(c);clearInterval(window._ck);window._ck=setInterval(()=>{const e=$("#clk");if(e)e.textContent="📅 "+fmtGame()},30000);
  if($("#bk"))$("#bk").onclick=()=>profile(me);
  if($("#rp"))$("#rp").onclick=()=>modal("Denunciar perfil",`<label>Motivo</label><textarea id="rs" maxlength="500"></textarea>`,async m=>{
    const r=await SB.from("reports").insert({reporter_id:user.id,character_id:c.id,reason:m.querySelector("#rs").value.trim()});
    if(r.error)throw new Error("Descreva o motivo (mín. 5 caracteres).");toast("Denúncia enviada. Obrigado!",true)},"Enviar");
}

async function people(q=""){
  let req=SB.from("characters").select("*").eq("world_id",world.id).order("supporters",{ascending:false}).limit(50);
  if(q)req=req.ilike("full_name",`%${q}%`);
  const [{data}]=await Promise.all([req,loadW()]);
  view(header("",null,"people")+`${pageH("Cidadãos","Todos os jogadores deste mundo.",`<button class="sec" id="ep">✏️ Editar meu perfil</button>`)}<input id="sq" placeholder="Buscar por nome..." value="${esc(q)}" style="margin:14px 0">
  <div class="card list">${(data||[]).map(c=>`<div data-id="${c.id}">${avatar(c)}<div style="flex:1"><b>${esc(c.full_name)}</b>${uname(c)}<div class="muted">${esc(c.city_name)}/${esc(c.state_uf)} · ${esc(IDEO[c.ideology])}${partyTag(c.id)}</div></div><span class="muted">${c.supporters} apoiadores</span></div>`).join("")||`<p class="muted" style="padding:12px">Ninguém encontrado.</p>`}</div>`);
  bindHeader();
  $("#ep").onclick=editMe;$("#sq").onkeydown=e=>{if(e.key==="Enter")people(e.target.value.trim())};
  document.querySelectorAll(".list [data-id]").forEach(el=>el.onclick=()=>profile(data.find(x=>x.id===el.dataset.id)));
}

/* ---------- AÇÕES DO CIDADÃO ---------- */
const ACT={
 trabalhar:["💼","Horas extras","Renda extra de trabalho.","+ cerca de 10% do salário",1],
 panfletar:["📣","Panfletagem","Converse com moradores e conquiste apoio.","- R$ 50 · + apoiadores",1],
 debate:["🗣️","Debate nas redes","Defenda suas ideias online.","+ apoiadores · risco à reputação",1],
 doacao:["🤝","Pedir doações","Arrecade com quem apoia você. Poucos apoiadores = risco de constrangimento.","Depende de apoiadores e reputação",6],
 evento:["🎤","Apresentação / evento","Palestra, show ou ato público. Pode lucrar ou fracassar.","Custa R$ 80 · lucro, apoio e reputação variam",3]};
const actPanel=()=>`<h3 style="margin:28px 0 12px">Ações do cidadão</h3><div class="grid">${Object.entries(ACT).map(([k,a])=>`<div class="stat"><b>${a[0]} ${a[1]}</b><span>${a[2]}</span><div class="muted" style="margin:6px 0 4px">${a[3]}</div><div class="muted" style="margin-bottom:10px">Recarga: ${a[4]} h</div><button data-act="${k}" style="width:100%">Executar</button></div>`).join("")}</div>`;
async function bindActions(){
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r=await SB.rpc("do_action",{p_world:world.id,p_action:b.dataset.act});
    if(r.error){b.disabled=false;return toast(r.error.message)}
    me=r.data.character;toast(r.data.msg,true);profile(me);
  });
  const {data}=await SB.from("action_log").select("action,created_at").eq("character_id",me.id).gte("created_at",new Date(Date.now()-6*36e5).toISOString());
  const seen={};
  (data||[]).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)).forEach(l=>{
    if(seen[l.action]||!ACT[l.action])return;seen[l.action]=1;
    const left=ACT[l.action][4]*36e5-(Date.now()-new Date(l.created_at));
    const b=document.querySelector(`[data-act="${l.action}"]`);
    if(b&&left>0){b.disabled=true;b.textContent=`Disponível em ${Math.max(1,Math.ceil(left/6e4))} min`}
  });
}

/* ---------- FINANÇAS ---------- */
const INV={renda_fixa:["🏦","Tesouro Selic","Renda fixa, risco baixíssimo. Cerca de 12% ao ano."],fii:["🏢","Fundos imobiliários","Rendimento de aluguéis. Risco moderado."],acoes:["📈","Ações (B3)","Bolsa de valores. Alto risco e alto retorno."],cripto:["🪙","Criptoativos","Muito volátil. Pode perder quase tudo."]};
const COST=[["🏠 Moradia",.38],["🍽️ Alimentação",.25],["🚌 Transporte",.12],["💊 Saúde",.08],["📚 Educação",.07],["🎬 Lazer e outros",.10]];
const dshort=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
async function finance(){
  view(loading("Abrindo suas finanças..."));
  const rr=await SB.rpc("settle_me",{p_world:world.id});if(rr.data?.id)me=rr.data;
  const [{data:inv},{data:led},{data:roles}]=await Promise.all([
    SB.from("investments").select("*").eq("character_id",me.id),
    SB.from("ledger").select("*").eq("character_id",me.id).order("created_at",{ascending:false}).order("month_idx",{ascending:false}).limit(25),
    SB.from("role_salaries").select("*").order("sort")]);
  const pos=Object.fromEntries((inv||[]).map(i=>[i.kind,i]));
  const total=(inv||[]).reduce((t,i)=>t+Number(i.value),0);
  view(header("",null,"fin")+`<h2 class="brand">Finanças</h2><p class="muted">Estado de referência: ${esc(me.state_uf)} · valores por mês de jogo</p>
  <div class="stats"><div class="stat"><b>${brl(me.money)}</b><span>Dinheiro disponível</span></div><div class="stat"><b>${brl(total)}</b><span>Total investido</span></div><div class="stat"><b>${brl(me.salary)}</b><span>Salário</span></div><div class="stat"><b>${brl(me.salary-me.expenses)}</b><span>Saldo mensal</span></div></div>
  <h3 style="margin:28px 0 12px">Custo de vida (${brl(me.expenses)}/mês)</h3><div class="card">${COST.map(([n,p])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><b>${brl(me.expenses*p)}</b></div><div style="height:6px;border-radius:9px;background:#0a1126;margin-top:4px"><div style="width:${p*250}%;max-width:100%;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--b))"></div></div></div>`).join("")}<p class="muted" style="margin-top:12px">Despesas básicas variam por estado. Gastos voluntários, como campanhas, são cobrados à parte.</p></div>
  <h3 style="margin:28px 0 12px">Investimentos</h3><div class="grid">${Object.entries(INV).map(([k,v])=>{const i=pos[k],val=i?Number(i.value):0,gain=i?val-Number(i.invested):0;return `<div class="stat"><b>${v[0]} ${v[1]}</b><span>${v[2]}</span><div style="margin:10px 0"><b>${brl(val)}</b><div class="muted" style="color:${gain>=0?"var(--g)":"var(--r)"}">${i?(gain>=0?"+":"")+brl(gain)+" sobre o aplicado":"Sem aplicação"}</div></div><div class="row"><button data-inv="${k}">Investir</button><button class="sec" data-red="${k}" ${val>0?"":"disabled"}>Resgatar</button></div></div>`}).join("")}</div>
  <p class="muted" style="margin-top:10px">Rendimentos são calculados a cada mês de jogo e variam de forma aleatória. Rentabilidade passada não garante ganhos futuros. Sem impostos nesta versão.</p>
  <h3 style="margin:28px 0 12px">Histórico</h3><div class="card list">${(led||[]).map(l=>`<div style="cursor:default"><div style="flex:1"><b>${esc(l.label)}</b><div class="muted">${dshort(l.game_date)}</div></div><b style="color:${l.amount>=0?"var(--g)":"var(--r)"}">${l.amount>=0?"+":""}${brl(l.amount)}</b></div>`).join("")||`<p class="muted" style="padding:12px">Ainda sem movimentações. O primeiro salário cai no próximo mês de jogo.</p>`}</div>
  <h3 style="margin:28px 0 12px">Salários por cargo</h3><div class="card list">${(roles||[]).map(r=>`<div style="cursor:default"><div style="flex:1"><b>${esc(r.label)}</b><div class="muted">${esc(r.note||"")}</div></div><b>${brl(r.salary)}${r.exact?"":" <span class=\"muted\">aprox.</span>"}</b></div>`).join("")}</div>`);
  bindHeader();
  const op=(k,red)=>modal(red?"Resgatar":"Investir",`<p class="muted" style="margin-top:8px">${INV[k][1]}${red?" · aplicado: "+brl(pos[k]?.value||0):" · mínimo R$ 100,00 · disponível: "+brl(me.money)}</p><label>Valor (R$)${red?" — vazio resgata tudo":""}</label><input id="va" type="number" min="1" step="0.01">`,async m=>{
    const v=m.querySelector("#va").value;
    const r=await SB.rpc(red?"redeem":"invest",red?{p_world:world.id,p_kind:k,p_amount:v?+v:null}:{p_world:world.id,p_kind:k,p_amount:+v});
    if(r.error)throw r.error;me=r.data.character;toast(r.data.msg,true);finance()},red?"Resgatar":"Investir");
  document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>op(b.dataset.inv,false));
  document.querySelectorAll("[data-red]").forEach(b=>b.onclick=()=>op(b.dataset.red,true));
}

/* ---------- GESTÃO DO SERVIDOR (líder) ---------- */
async function manage(){
  view(loading("Carregando membros..."));
  const [{data:mem},{data:chars}]=await Promise.all([SB.from("world_members").select("*").eq("world_id",world.id).order("joined_at"),SB.from("characters").select("user_id,full_name,city_name,state_uf").eq("world_id",world.id)]);
  const cm=Object.fromEntries((chars||[]).map(c=>[c.user_id,c]));
  view(header("",me?null:servers,me?"manage":null)+`<h2 class="brand">Gerenciar: ${esc(world.name)}</h2><p class="muted">${(mem||[]).length} membro(s)</p>
  <div class="card list" style="margin-top:14px">${(mem||[]).map(m=>{const c=cm[m.user_id];return `<div style="cursor:default"><div style="flex:1"><b>${esc(c?c.full_name:"Jogador sem personagem")}</b> ${m.role==="owner"?`<span class="tag">Líder</span>`:""}<div class="muted">${c?esc(c.city_name)+"/"+esc(c.state_uf):"Ainda não criou personagem"}</div></div>${m.role==="owner"?"":`<button class="sec" data-kick="${m.user_id}">Expulsar</button><button class="dng" data-ban="${m.user_id}">Banir</button>`}</div>`}).join("")}</div>
  <div class="card" style="margin-top:20px;border-color:#7f1d1d"><h3>Zona de perigo</h3><p class="muted" style="margin:6px 0 14px">Excluir o servidor apaga todos os personagens e dados dele. Não dá para desfazer.</p><button class="dng" id="del">Excluir servidor</button></div>`);
  bindHeader();

function partyDetail(id){

  else if(ap)action=`<span class="muted">Você já tem um pedido em andamento em outro partido.</span>`;

  view(header("",partiesView,"parties")+`<div class="card"><div class="prof"><div class="av" style="border-radius:22px;font-size:1.05rem">${esc(p.acronym.slice(0,5))}</div><div style="flex:1;min-width:230px"><h2>${esc(p.name)}</h2><div style="margin:10px 0"><span class="tag">${esc(p.acronym)}</span>${p.number?`<span class="tag">nº ${p.number}</span>`:""}<span class="tag b">${esc(IDEO[p.ideology])}</span>${p.status==="em_formacao"?`<span class="tag y">Em formação: precisa de 5 filiados</span>`:`<span class="tag">Registrado</span>`}</div><p>${esc(p.description||"Sem descrição.")}</p></div></div><p class="muted" style="margin-top:16px">${info}</p>${last?`<p style="margin-top:12px;color:var(--y)">Seu último pedido foi ${last.status==="recusada"?"recusado":"reprovado"}${last.decision_note?": "+esc(last.decision_note):"."}</p>`:""}<div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">${action}</div></div><h3 style="margin:30px 0 14px">Integrantes</h3>${mrows(id,false)}`);

async function interviewView(aid){
  clearInterval(window._iv);ivMin=false;
  const r=await SB.rpc("party_interview_state",{p_app:aid});
  if(r.error){toast(r.error.message);ivMin=true;return partiesView()}
  const st=r.data,a=W.apps.find(x=>x.id===aid),pn=esc(W.parties.find(x=>x.id===a?.party_id)?.acronym||"partido");
  if(st.status==="agendada"){
    _ivHere=true;
    view(header("",null,"parties")+`<div class="card" style="text-align:center;padding:64px 30px"><div style="font-size:3.2rem">📨</div><h2 style="margin:10px 0">O ${pn} gostou do seu perfil!</h2><p class="muted" style="font-size:1.05rem">O RH do partido vai entrevistar você em</p><div class="brand" style="font-size:3.4rem;margin:12px 0" id="cd">1:00</div><p class="muted">Prepare-se: as perguntas vão testar se você realmente defende os valores do partido.</p>${ivBtns()}</div>`);
    _ivHere=false;bindHeader();bindIv(aid);
    const end=Date.now()+st.seconds_left*1000;
    window._iv=setInterval(()=>{const el=$("#cd");if(!el){clearInterval(window._iv);return}const sc=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=`${Math.floor(sc/60)}:${String(sc%60).padStart(2,"0")}`;if(sc<=0){clearInterval(window._iv);interviewView(aid)}},500);
  }else if(st.status==="entrevista"){
    _ivHere=true;
    view(header("",null,"parties")+`<div class="card"><p class="muted">Entrevista do ${pn} · pergunta ${st.index+1} de ${st.total}</p><div class="bar" style="margin:12px 0 26px"><i style="width:${st.index/st.total*100}%;background:linear-gradient(90deg,var(--g),var(--b))"></i></div><h2 style="margin-bottom:8px">🎙️ RH do partido</h2><p style="font-size:1.25rem;margin-bottom:24px">${esc(st.prompt)}</p><div style="display:grid;gap:12px">${st.options.map((o,i)=>`<button class="sec opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>${ivBtns()}</div>`);
    _ivHere=false;bindHeader();bindIv(aid);
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{document.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);const x=await SB.rpc("party_interview_answer",{p_app:aid,p_pos:+b.dataset.o});if(x.error)toast(x.error.message);interviewView(aid)});
  }else if(st.status==="aprovada"){
    await loadW(true);toast("Aprovado! Você agora é filiado ao partido.",true);myPartyView();

  let panel="";
  if(ph==="pre"){
    panel=`<div class="card"><h3>📋 Preparação</h3><p class="muted" style="margin-top:6px">Para concorrer em ${e.year}, é preciso estar filiado a um partido até <b>${fdt(cal.filiacao)}</b>. As candidaturas são registradas nas convenções, de ${fdt(cal.convencoes)} a ${fdt(cal.registro)}.</p>
    <p style="margin-top:12px">${myP?`✅ Você está filiado ao <b>${esc(myP.acronym)}</b>.`:gd<=cal.filiacao?`⚠️ Você ainda não tem partido. Filie-se até ${fdt(cal.filiacao)} para poder concorrer.`:`⛔ O prazo de filiação já passou. Você ainda pode votar.`}</p>
    <p class="muted" style="margin-top:12px">Partidos reais exigem apoiadores (grandes: 5.000 · médios: 1.500 · pequenos: 300), reputação 50 e colaboração 50. Em partidos de jogadores, o presidente do partido registra o candidato.</p></div>`;
  }else if(ph==="convencoes"){
    if(mc)panel=`<div class="card"><h3>✅ Candidatura registrada</h3><p class="muted" style="margin-top:6px">Você é o candidato do ${esc(mc.party_acronym)} (nº ${mc.number}), com ${esc(mc.vice_name)} de vice. A campanha começa em ${fdt(cal.campanha)}. Fundo eleitoral: <b>${brl(mc.fund)}</b>.</p><div class="acts" style="margin-top:12px"><button class="dng" id="cw">Desistir da candidatura</button></div></div>`;
    else if(!myP)panel=`<div class="card"><h3>🗳️ Convenções</h3><p class="muted" style="margin-top:6px">Os partidos estão escolhendo seus candidatos. Como você não é filiado, nesta eleição você participa como eleitor.</p></div>`;
    else{
      const presOfOwn=!myP.is_real&&myMem?.role==="presidente";
      const opts=presOfOwn?W.pm.filter(x=>x.party_id===myP.id).map(x=>`<option value="${x.character_id}">${esc(W.ch[x.character_id]?.full_name||"Filiado")}</option>`).join(""):"";
      const has=C.find(c=>c.party_id===myP.id&&!c.is_npc);
      panel=`<div class="card"><h3>🗳️ Convenção do ${esc(myP.acronym)}</h3>`+(has?`<p class="muted" style="margin-top:6px">O partido já registrou ${esc(has.name)} como candidato.</p>${presOfOwn?`<div class="acts" style="margin-top:12px"><button class="dng" id="cw">Retirar candidatura do partido</button></div>`:""}`
       :myP.is_real?`<p class="muted" style="margin-top:6px">Peça a vaga de candidato a presidente do ${esc(myP.acronym)}. Se cumprir os requisitos, você substitui o pré-candidato do partido.</p><div class="acts" style="margin-top:12px"><button id="cr">Registrar minha candidatura</button></div>`
       :presOfOwn?`<p class="muted" style="margin-top:6px">Como presidente do partido, escolha o candidato (filiado até ${fdt(cal.filiacao)}).</p><label>Candidato</label><select id="cc">${opts}</select><div class="acts" style="margin-top:12px"><button id="cr">Registrar candidatura</button></div>`
       :`<p class="muted" style="margin-top:6px">Só o presidente do ${esc(myP.acronym)} pode registrar o candidato do partido.</p>`)+`</div>`;
    }
  }else if((ph==="campanha"||ph==="segundo_turno")&&mc&&["ativo","segundo_turno"].includes(mc.status)){
    const eff=Object.entries(o.my_effort||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    panel=`<div class="card"><h3>📣 Sua campanha${ph==="segundo_turno"?" no 2º turno":""}</h3>
    <div class="stats"><div class="stat"><b>${brl(mc.fund)}</b><span>Fundo eleitoral</span></div><div class="stat"><b>${brl(o.me?.money||0)}</b><span>Seu dinheiro</span></div><div class="stat"><b>${brl(mc.spent)}</b><span>Gasto na campanha</span></div><div class="stat"><b>${nfmt(Math.round(mc.national_effort))}</b><span>Presença nacional</span></div></div>
    <p class="muted" style="margin-top:12px">Os gastos saem primeiro do fundo eleitoral e depois do seu dinheiro.</p>
    <div class="row" style="margin-top:12px;align-items:flex-end"><div><label>Estado do comício</label><select id="cu">${(o.states||[]).map(s=>`<option value="${s.uf}">${s.uf} · ${nfmt(s.voters)} eleitores</option>`).join("")}</select></div><button id="cm" style="flex:none">🎤 Comício (R$ 500)</button></div>
    <div class="acts" style="margin-top:12px;justify-content:flex-start"><button class="sec" id="cp">📺 Propaganda</button><button class="sec" id="ce">🎙️ Entrevista (grátis)</button>${ph==="campanha"?`<button class="dng" id="cw">Desistir</button>`:""}</div>
    ${eff.length?`<p class="muted" style="margin-top:14px">Sua presença por estado: ${eff.map(([u,v])=>`<span class="tag b">${u} ${Math.round(v)}</span>`).join("")}</p>`:`<p class="muted" style="margin-top:14px">Você ainda não fez comícios. Estados grandes (SP, MG, RJ, BA) valem mais votos.</p>`}</div>`;
  }
  // votação
  const vr=o.vote_round,voteable=vr?C.filter(c=>c.status===(vr===1?"ativo":"segundo_turno")):[];
  const votedName=o.voted?(o.my_vote?C.find(c=>c.id===o.my_vote)?.name:"Branco"):null;
  const votePanel=vr?`<div class="card" style="margin-top:18px"><h3>🗳️ Urna — ${vr}º turno</h3><p class="muted" style="margin-top:6px">${o.voted?`Seu voto: <b>${esc(votedName||"—")}</b>. Você pode mudar até a apuração em ${fdt(vr===1?cal.turno1:cal.turno2)}.`:`Você ainda não votou. A apuração é em ${fdt(vr===1?cal.turno1:cal.turno2)}.`} Cada jogador vale 0,3% dos votos válidos, somados no estado do personagem.</p><div class="acts" style="margin-top:12px;justify-content:flex-start"><button class="sec" id="vb">Votar em branco</button></div></div>`:"";
  // candidatos
  const showPct=e.round1_done;
  const ccard=c=>{const [st,sc]=ST_C[c.status]||[c.status,"b"],mine=o.my_vote===c.id&&o.voted;
    return `<div class="card pcard ${c.character_id===me.id?"me":""}" ${c.character_id?`data-cc="${c.character_id}"`:""}><div style="display:flex;gap:14px;align-items:center"><div class="num">${c.number??"?"}</div><div style="flex:1"><b style="font-size:1.1rem">${esc(c.name)}</b><div class="muted">${esc(c.party_acronym||"")} · ${esc(IDEO[c.ideology]||"")} · vice ${esc(c.vice_name||"—")}</div></div></div>
    <div style="margin-top:10px"><span class="tag ${sc}">${st}</span>${c.is_npc?`<span class="tag b">NPC</span>`:`<span class="tag">Jogador</span>`}${mine?`<span class="tag">✔ seu voto</span>`:""}</div>
    <div class="muted" style="margin-top:8px">${nfmt(c.live_supporters)} apoiadores · reputação ${c.live_reputation}${c.home_uf?` · base ${c.home_uf}`:""}</div>
    ${showPct?`<div style="margin-top:10px">${c.pct1!=null?`<div class="hb"><span>1º turno</span><i style="width:${Math.min(c.pct1,100)}%"></i><b>${String(c.pct1).replace(".",",")}%</b></div>`:""}${c.pct2!=null?`<div class="hb"><span>2º turno</span><i style="width:${Math.min(c.pct2,100)}%"></i><b>${String(c.pct2).replace(".",",")}%</b></div>`:""}</div>`:""}
    ${voteable.includes(c)?`<button class="${mine?"sec":""}" data-vote="${c.id}" style="margin-top:12px;width:100%">${mine?"Seu voto ✔":"Votar em "+c.number}</button>`:""}</div>`};
  const candBlock=C.length?`<h3 style="margin:30px 0 14px">Candidatos (${C.length})</h3><div class="grid wide">${C.map(ccard).join("")}</div>`:ph==="pre"?"":`<p class="muted" style="margin-top:20px">Nenhum candidato ainda.</p>`;
  // resultado por estado
  let byState="";
  if(e.round1_done&&o.results.length){
    const rd=e.round2_done?2:1,rows={},nm=Object.fromEntries(C.map(c=>[c.id,c]));
    o.results.filter(x=>x.round===rd).forEach(x=>{(rows[x.uf]=rows[x.uf]||[]).push(x)});
    const ord=(o.states||[]).map(s=>s.uf).filter(u=>rows[u]);
    byState=`<h3 style="margin:30px 0 14px">Resultado por estado (${rd}º turno)</h3><div class="card"><div class="ufg">${ord.map(u=>{const L=rows[u].sort((a,b)=>b.votes-a.votes),t=L.reduce((s,x)=>s+x.votes,0),w=nm[L[0].candidate_id];return `<div><b>${u}</b><span>${esc(w?.party_acronym||"?")} ${t?Math.round(1000*L[0].votes/t)/10:0}%</span></div>`}).join("")}</div>
    <p class="muted" style="margin-top:12px">Votos válidos: ${nfmt(rd===2?e.valid2:e.valid1)} · comparecimento aprox.: ${nfmt(rd===2?e.turnout2:e.turnout1)} de ${nfmt(e.electorate)} eleitores.</p></div>`;
  }
  view(header("",null,"elec")+pageH(`Eleições ${e.year} · Presidência`,`${PH[ph]} · data do jogo: ${fdt(gd)}`)+pres+timeline+panel+votePanel+candBlock+byState);
  bindHeader();
  if($("#vp"))$("#vp").onclick=()=>openChar(o.president.character_id);
  document.querySelectorAll("[data-cc]").forEach(x=>x.onclick=()=>openChar(x.dataset.cc));
  const run=async(fn,args,b)=>{if(b)b.disabled=true;const r=await SB.rpc(fn,{p_world:world.id,...args});if(r.error){if(b)b.disabled=false;return toast(r.error.message)}toast(r.data.msg,true);electionsView()};
  if($("#cr"))$("#cr").onclick=()=>run("cand_register",{p_char:$("#cc")?$("#cc").value:null},$("#cr"));
  if($("#cw"))$("#cw").onclick=()=>modal("Desistir da candidatura",`<p class="muted" style="margin-top:8px">A candidatura será retirada e os votos já dados nela serão anulados.</p>`,async()=>{const r=await SB.rpc("cand_withdraw",{p_world:world.id});if(r.error)throw r.error;toast(r.data.msg,true);electionsView()},"Desistir");
  if($("#cm"))$("#cm").onclick=()=>run("campaign_act",{p_kind:"comicio",p_uf:$("#cu").value},$("#cm"));
  if($("#ce"))$("#ce").onclick=()=>run("campaign_act",{p_kind:"entrevista"},$("#ce"));
  if($("#cp"))$("#cp").onclick=()=>modal("Propaganda na TV e na internet",`<p class="muted" style="margin-top:8px">Cada R$ 100 rende 1 ponto de presença nacional. Mínimo de R$ 1.000.</p><label>Valor (R$)</label><input id="pa" type="number" min="1000" step="500" value="5000">`,async m=>{const r=await SB.rpc("campaign_act",{p_world:world.id,p_kind:"propaganda",p_amount:Number(m.querySelector("#pa").value)});if(r.error)throw r.error;toast(r.data.msg,true);electionsView()},"Veicular");
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=e=>{e.stopPropagation();run("cast_vote",{p_candidate:b.dataset.vote},b)});
  if($("#vb"))$("#vb").onclick=()=>run("cast_vote",{p_candidate:null},$("#vb"));
}

/* ----- Amigos e aliados ----- */
async function alliesView(){
  view(loading("Carregando sua rede..."));await loadW(true);
  const other=r=>r.requester_id===me.id?r.target_id:r.requester_id;
  const got=W.rel.filter(r=>r.status==="pendente"&&r.target_id===me.id),sent=W.rel.filter(r=>r.status==="pendente"&&r.requester_id===me.id),ok=W.rel.filter(r=>r.status==="aceito");
  const kind=r=>r.kind==="aliado"?`<span class="tag">🤝 Aliado</span>`:`<span class="tag b">👋 Amigo</span>`;
  const p=partyOf(me.id),ms=movsOf(me.id);
  const sec=(t,b)=>`<h3 style="margin:30px 0 14px">${t}</h3><div class="card list">${b}</div>`;
  view(header("",null,"allies")+pageH("Aliados","Alianças valem só neste mundo. Amizades são globais e ficam na tela inicial.")+
   (got.length?sec(`Pedidos recebidos (${got.length})`,got.map(r=>prow(r.requester_id,`${kind(r)}<button data-ra="${r.id}">Aceitar</button><button class="sec" data-rd="${r.id}">Recusar</button>`)).join("")):"")+
   sec(`Aliados neste mundo (${ok.length})`,ok.map(r=>prow(other(r),`${kind(r)}<button class="sec" data-rm="${r.id}">Desfazer aliança</button>`)).join("")||empty("Você ainda não tem aliados neste mundo. Abra o perfil de um cidadão para pedir uma aliança."))+
   sec(p?`Meu partido: ${esc(p.acronym)}`:"Meu partido",p?W.pm.filter(x=>x.party_id===p.id&&x.character_id!==me.id).map(x=>prow(x.character_id,x.role==="presidente"?`<span class="tag">Presidente</span>`:"")).join("")||empty("Você é o único filiado por enquanto."):empty("Você ainda não é filiado a nenhum partido. Veja a aba Partidos."))+
   (ms.length?ms.map(m=>sec(`Movimento: ${esc(m.name)}`,W.mm.filter(x=>x.movement_id===m.id&&x.character_id!==me.id).map(x=>prow(x.character_id,x.role==="lider"?`<span class="tag">Líder</span>`:"")).join("")||empty("Você é o único membro por enquanto."))).join(""):sec("Meus movimentos",empty("Você ainda não participa de movimentos. Veja a aba Movimentos.")))+
   (sent.length?sec(`Pedidos enviados (${sent.length})`,sent.map(r=>prow(r.target_id,`${kind(r)}<button class="sec" data-rm="${r.id}">Cancelar pedido</button>`)).join("")):""));
  bindHeader();bindRows();
  const bindB=(sel,fn,msg)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;if(await act(fn,b.dataset.args?JSON.parse(b.dataset.args):{},msg))alliesView();else b.disabled=false});
  document.querySelectorAll("[data-ra]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_respond",{p_rel:b.dataset.ra,p_accept:true},"Pedido aceito!"))alliesView()});
  document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_respond",{p_rel:b.dataset.rd,p_accept:false},"Pedido recusado."))alliesView()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await act("relate_remove",{p_rel:b.dataset.rm},"Relação removida."))alliesView()});
}

/* ---------- SONS E INÍCIO ---------- */
let _w=false;addEventListener("pointerdown",()=>{if(!_w&&!user){_w=true;SND.welcome()}});
document.addEventListener("click",e=>{if(e.target.closest("button,.mode,.list>div,a"))SND.click()});
let _h=0;document.addEventListener("mouseover",e=>{const t=e.target.closest(".mode,button");if(t&&t!==window._ht&&Date.now()-_h>90){window._ht=t;_h=Date.now();SND.hover()}});
document.addEventListener("mouseout",()=>{window._ht=null});
SB.auth.onAuthStateChange((ev,s)=>{
  const u=s?.user||null;
  if(u&&(!user||user.id!==u.id)){user=u;SND.ok();hub();SB.from("states").select("*").order("name").then(r=>{if(r.data)states=r.data})}
  else if(!u){user=null;authView()}
});
SB.auth.getSession().then(({data})=>{if(!data.session)authView()});
</script>
