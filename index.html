 function tone(f,d=.12,type="sine",v=.05,t0=0,slide=0){if(!on)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03)}catch{}}

  <div class="row"><div><label>Ideologia</label><select id="id">${opts(IDEO,"centro")}</select></div><div><label>Perfil político</label><select id="pf">${opts(PROF,"ativista")}</select></div></div>
  <div class="row"><div><label>Estado inicial</label><select id="uf"><option value="">Selecione...</option>${states.map(s=>`<option value="${s.uf}">${esc(s.name)}</option>`).join("")}</select></div><div><label>Cidade inicial</label><select id="ct" disabled><option>Escolha o estado primeiro</option></select></div></div>
  <button class="full" id="sv">Começar minha jornada</button></div>`);
  bindHeader();
  $("#uf").onchange=async e=>{
    const ct=$("#ct");ct.disabled=true;ct.innerHTML="<option>Carregando...</option>";
    try{const uf=e.target.value;const j=CITY[uf]||(CITY[uf]=await (await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`)).json());
      ct.innerHTML=j.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");ct.disabled=false}catch{ct.innerHTML="<option>Erro ao carregar</option>"}
  };
  $("#sv").onclick=async()=>{
    const fn=$("#fn").value.trim(),uf=$("#uf").value,ct=$("#ct");
    if(fn.length<3||!uf||ct.disabled)return toast("Preencha nome, estado e cidade.");
    $("#sv").disabled=true;let photo_url=null;const f=$("#ph").files[0];
    if(f){if(f.size>2097152){$("#sv").disabled=false;return toast("Foto maior que 2 MB.")}
      const path=`${user.id}/${Date.now()}.${f.type.split("/")[1]}`;const up=await SB.storage.from("avatars").upload(path,f);
      if(up.error){$("#sv").disabled=false;return toast("Falha na foto: "+up.error.message)}
      photo_url=SB.storage.from("avatars").getPublicUrl(path).data.publicUrl}
    const ideo=$("#id").value;
    const r=await SB.from("characters").insert({user_id:user.id,world_id:world.id,full_name:fn,description:$("#ds").value.trim()||null,photo_url,ideology:ideo,econ_axis:AXIS[ideo],social_axis:AXIS[ideo],political_profile:$("#pf").value,state_uf:uf,city_ibge_id:+ct.value,city_name:ct.options[ct.selectedIndex].text}).select().single();
    if(r.error){$("#sv").disabled=false;return toast(r.error.message)}
    SND.ok();me=r.data;profile(me);
  };
}

function profile(c){
  const mine=c.user_id===user.id;
  const date=fmtGame();
  view(header(`<span class="clock" id="clk">📅 ${esc(date)}</span>`,mine?hub:()=>people())+`<div class="card"><div class="prof">${avatar(c)}<div style="flex:1;min-width:200px">
   <h2>${esc(c.full_name)}</h2><div style="margin:6px 0"><span class="tag">${esc(c.role==="cidadao"?"Cidadão":c.role)}</span><span class="tag b">${esc(IDEO[c.ideology])}</span><span class="tag b">${esc(PROF[c.political_profile])}</span></div>
   <div class="muted">📍 ${esc(c.city_name)} — ${esc(c.state_uf)}</div></div></div>
   <p style="margin-top:16px">${esc(c.description||"Sem descrição.")}</p>
   <div class="stats"><div class="stat"><b>${brl(c.salary)}</b><span>Salário mensal</span></div><div class="stat"><b>${brl(c.money)}</b><span>Dinheiro</span></div><div class="stat"><b>${c.supporters.toLocaleString("pt-BR")}</b><span>Apoiadores</span></div><div class="stat"><b>${c.reputation}/100</b><span>Reputação</span></div></div>
   <div class="row" style="margin-top:20px">${mine?"":`<button class="dng" id="rp">Denunciar perfil</button>`}<button class="sec" id="pp">👥 Ver cidadãos do mundo</button>${mine?"":`<button id="bk">Meu perfil</button>`}</div></div>
   <p class="muted" style="margin-top:14px;text-align:center">Mundo: ${esc(world.name)} · Em breve: partidos, movimentos, manifestações e eleições.</p>`);
  bindHeader();
  $("#pp").onclick=()=>people();clearInterval(window._ck);window._ck=setInterval(()=>{const e=$("#clk");if(e)e.textContent="📅 "+fmtGame()},30000);
  if($("#bk"))$("#bk").onclick=()=>profile(me);
  if($("#rp"))$("#rp").onclick=()=>modal("Denunciar perfil",`<label>Motivo</label><textarea id="rs" maxlength="500"></textarea>`,async m=>{
    const r=await SB.from("reports").insert({reporter_id:user.id,character_id:c.id,reason:m.querySelector("#rs").value.trim()});
    if(r.error)throw new Error("Descreva o motivo (mín. 5 caracteres).");toast("Denúncia enviada. Obrigado!",true)},"Enviar");
}

async function people(q=""){
  let req=SB.from("characters").select("*").eq("world_id",world.id).order("supporters",{ascending:false}).limit(50);
  if(q)req=req.ilike("full_name",`%${q}%`);
  const {data}=await req;
  view(header("",()=>profile(me))+`<h2 class="brand">Cidadãos</h2><input id="sq" placeholder="Buscar por nome..." value="${esc(q)}" style="margin:14px 0">
  <div class="card list">${(data||[]).map(c=>`<div data-id="${c.id}">${avatar(c)}<div style="flex:1"><b>${esc(c.full_name)}</b><div class="muted">${esc(c.city_name)}/${esc(c.state_uf)} · ${esc(IDEO[c.ideology])}</div></div><span class="muted">${c.supporters} apoiadores</span></div>`).join("")||`<p class="muted" style="padding:12px">Ninguém encontrado.</p>`}</div>`);
  bindHeader();
  $("#sq").onkeydown=e=>{if(e.key==="Enter")people(e.target.value.trim())};
  document.querySelectorAll(".list [data-id]").forEach(el=>el.onclick=()=>profile(data.find(x=>x.id===el.dataset.id)));
}

/* ---------- SONS E INÍCIO ---------- */
let _w=false;addEventListener("pointerdown",()=>{if(!_w&&!user){_w=true;SND.welcome()}});
document.addEventListener("click",e=>{if(e.target.closest("button,.mode,.list>div,a"))SND.click()});
let _h=0;document.addEventListener("mouseover",e=>{const t=e.target.closest(".mode,button");if(t&&t!==window._ht&&Date.now()-_h>90){window._ht=t;_h=Date.now();SND.hover()}});
document.addEventListener("mouseout",()=>{window._ht=null});
SB.auth.onAuthStateChange((ev,s)=>{
  const u=s?.user||null;
  if(u&&(!user||user.id!==u.id)){user=u;SND.ok();hub();SB.from("states").select("*").order("name").then(r=>{if(r.data)states=r.data})}
  else if(!u){user=null;authView()}
});
SB.auth.getSession().then(({data})=>{if(!data.session)authView()});
</script>
</body>
